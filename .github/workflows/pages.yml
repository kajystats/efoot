name: Déployer EFOOT sur GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Préparer le frontend
        run: |
          mkdir -p public
          cp -r frontend/* public/
          # Vérifier la présence de config.js
          test -f public/config.js || echo "⚠️ config.js manquant"

      - name: Déployer
        uses: actions/deploy-pages@v4
